<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>Antigravity CLI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap');
    
    :root {
      --bg-main: #2b2b2b;
      --bg-bar: #141414;
      --bg-btn: #2a2b2e;
      --bg-btn-hover: rgba(255, 255, 255, 0.08);
      --bg-btn-active: rgba(255, 255, 255, 0.12);
      --text-main: #ffffff;
      --text-secondary: #9aa0a6;
      --border-color: rgba(255, 255, 255, 0.1);
      --tab-active-bg: #2b2b2b;
      --tab-active-text: #ffffff;
      --tab-hover-bg: #3c4043;
      --context-menu-bg: #141414;
      --kbd-bg: #2a2b2e;
      --kbd-border: rgba(255, 255, 255, 0.1);
    }

    [data-theme="light"] {
      --bg-main: #ffffff;
      --bg-bar: #f6f8fa;
      --bg-btn: #eaeef2;
      --bg-btn-hover: #d0d7de;
      --bg-btn-active: #afb8c1;
      --text-main: #1f2328;
      --text-secondary: #656d76;
      --border-color: #d0d7de;
      --tab-active-bg: #ffffff;
      --tab-active-text: #1f2328;
      --tab-hover-bg: #e4e7eb;
      --context-menu-bg: #f6f8fa;
      --kbd-bg: #eaeef2;
      --kbd-border: #d0d7de;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      max-width: 100vw;
      height: 100%;
      overflow: hidden;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #app-root {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      max-width: 100vw;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
      background: var(--bg-main);
      transition: background 0.2s ease, color 0.2s ease;
    }
    
    #terminal-container {
      flex: 1;
      width: 100%;
      position: relative;
      background: var(--bg-main);
      transition: background 0.2s ease;
    }
    
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: var(--bg-main);
    }
    
    #footer {
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-bar);
      border-top: none;
      flex-shrink: 0;
      box-shadow: none;
      position: relative;
      z-index: 9999;
      overflow: visible !important;
      gap: 12px;
      width: 100%;
      max-width: 100vw;
      box-sizing: border-box;
      transition: background 0.2s ease;
    }
    
    .footer-left {
      display: flex;
      align-items: center;
      flex: 1 0 auto;
    }
    
    .footer-center {
      display: flex;
      gap: 4px;
      flex: 0 0 auto;
      justify-content: center;
    }
    
    .footer-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex: 1 0 auto;
    }

    .tool-btn {
      background: var(--bg-btn);
      border: none;
      color: var(--text-secondary);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      padding: 0;
      transition: background 0.15s, color 0.15s, transform 0.1s;
      touch-action: manipulation;
    }
    
    .tool-btn:hover {
      background: var(--bg-btn-hover);
      color: var(--text-main);
    }
    
    .tool-btn:active {
      background: var(--bg-btn-active);
      transform: scale(0.92);
    }
    
    #upload-btn {
      background: var(--bg-btn);
      color: var(--text-secondary);
      border: none;
      padding: 0;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s, transform 0.1s;
    }
    
    #upload-btn:hover {
      background: var(--bg-btn-hover);
      color: var(--text-main);
    }
    
    #upload-btn:active {
      background: var(--bg-btn-active);
      transform: scale(0.92);
    }
    
    #upload-btn:disabled {
      background: #1a1a1a;
      color: #555555;
      cursor: not-allowed;
    }
    
    .context-menu {
      position: absolute;
      bottom: 60px;
      left: 12px;
      background: var(--context-menu-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      display: none;
      z-index: 100;
      flex-direction: column;
    }
    
    .context-menu.show {
      display: flex;
    }
    
    .context-menu-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 8px;
    }
    
    .context-menu .tool-btn {
      width: auto;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 500;
      background: var(--bg-btn);
      color: var(--text-main);
    }
    
    /* Overlay that shows notifications/messages to the user */
    #notification {
      position: absolute;
      top: 95px;
      left: 50%;
      transform: translateX(-50%);
      background: #1f6feb;
      color: white;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 100000;
      text-align: center;
      max-width: 90vw;
      white-space: pre-line;
    }
    
    #notification.show {
      opacity: 1;
      pointer-events: auto;
    }

    #app-root.toolbar-bottom #notification {
      top: 50px;
    }

    /* Modal Overlay for loading states */
    #loader-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
    }
    
    #loader-modal.show {
      opacity: 1;
      pointer-events: all;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    #loader-text {
      color: white;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-align: center;
    }

    /* Tabs CSS */
    #tab-bar {
      display: flex;
      background: var(--bg-bar);
      border-bottom: none;
      padding: 8px 8px 0 8px;
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
      width: 100%;
      max-width: 100vw;
      box-sizing: border-box;
      transition: background 0.2s ease;
    }
    #tab-bar::-webkit-scrollbar { display: none; }
    
    .tab {
      display: flex;
      align-items: center;
      background: transparent;
      color: var(--text-secondary);
      padding: 8px 16px;
      margin-right: 2px;
      border-radius: 8px 8px 0 0;
      border: none;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      position: relative;
      transition: background 0.15s;
    }
    .tab:hover:not(.active) {
      background: var(--tab-hover-bg);
    }
    .tab.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      z-index: 2;
    }
    .tab.active::before,
    .tab.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 12px;
      height: 12px;
      pointer-events: none;
    }
    .tab.active::before {
      left: -12px;
      border-bottom-right-radius: 12px;
      box-shadow: 6px 6px 0 6px var(--tab-active-bg);
    }
    .tab.active::after {
      right: -12px;
      border-bottom-left-radius: 12px;
      box-shadow: -6px 6px 0 6px var(--tab-active-bg);
    }
    .tab-close {
      margin-left: 8px;
      color: var(--text-secondary);
      font-size: 16px;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 50%;
    }
    .tab-close:hover { 
      background: rgba(255, 255, 255, 0.1); 
      color: var(--text-main); 
    }
    
    .tab-add {
      background: transparent;
      color: var(--text-secondary);
      border: none;
      font-size: 20px;
      padding: 0 10px;
      margin-left: 4px;
      cursor: pointer;
      border-radius: 50%;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      align-self: center;
    }
    .tab-add:hover { 
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main); 
    }

    .footer-right .tool-btn {
      margin-left: 8px;
    }

    .shortcut-kbd {
      background: var(--kbd-bg);
      border: 1px solid var(--kbd-border);
      border-bottom: 2px solid rgba(0, 0, 0, 0.3);
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 10px;
      color: var(--text-secondary);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      box-shadow: 0 1px 0 rgba(0,0,0,0.2);
    }

    @media (max-width: 480px) {
      .desktop-only-text {
        display: none !important;
      }
      .toolbar-footer {
        padding: 4px;
      }
      .context-menu {
        left: 4px;
        right: 4px;
        padding: 8px;
        border-radius: 12px;
      }
      .context-menu-grid {
        grid-template-columns: repeat(12, 1fr);
        gap: 6px;
      }
      .context-menu .tool-btn {
        padding: 8px 4px;
      }
      .footer-center {
        gap: 2px;
      }
      .tool-btn {
        width: 32px;
        height: 32px;
      }
      #upload-btn {
        width: 32px;
        height: 32px;
      }
      .tab-btn {
        margin-right: 2px !important;
      }
      .new-btn {
        margin-left: 2px !important;
      }
      #tab-bar {
        padding: 4px 4px 0 4px;
      }
      .tab {
        padding: 6px 10px;
        font-size: 12px;
      }
    }

    /* Flex Ordering (Default: Toolbar TOP above tabs) */
    #footer {
      order: 0;
      flex-shrink: 0;
      position: relative;
      z-index: 9999;
      overflow: visible !important;
      border-top: none;
      border-bottom: 1px solid var(--border-color);
    }
    #tab-bar {
      order: 1;
      flex-shrink: 0;
    }
    #update-banner {
      order: 2;
      flex-shrink: 0;
    }
    #terminal-container {
      order: 3;
      flex: 1;
      position: relative;
      z-index: 1;
    }

    /* Context menu opens DOWNWARD when toolbar is at top */
    .context-menu {
      position: absolute;
      top: calc(100% + 6px) !important;
      bottom: auto !important;
      left: 12px;
      z-index: 10000 !important;
    }
    #dpad-menu {
      left: 50% !important;
      transform: translateX(-50%) !important;
      top: calc(100% + 6px) !important;
      bottom: auto !important;
      z-index: 10000 !important;
    }

    /* User override: Toolbar BOTTOM */
    #app-root.toolbar-bottom #footer {
      order: 4 !important;
      border-bottom: none !important;
      border-top: 1px solid var(--border-color) !important;
      position: relative !important;
      z-index: 9999 !important;
      overflow: visible !important;
    }
    #app-root.toolbar-bottom #tab-bar {
      order: 1 !important;
    }
    #app-root.toolbar-bottom #terminal-container {
      order: 3 !important;
    }
    #app-root.toolbar-bottom .context-menu {
      top: auto !important;
      bottom: calc(100% + 6px) !important;
      left: 12px !important;
      z-index: 10000 !important;
    }
    #app-root.toolbar-bottom #dpad-menu {
      top: auto !important;
      bottom: calc(100% + 6px) !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      z-index: 10000 !important;
    }
  </style>
</head>
<body>
  <div id="app-root">
    <div id="tab-bar"></div>
  
  <div id="update-banner" style="display: none; background: #238636; color: white; padding: 6px 12px; font-size: 12px; font-family: monospace; align-items: center; justify-content: space-between; border-bottom: 1px solid #2ea043; z-index: 100;">
    <span id="update-text" data-i18n="update_available">New version available!</span>
    <button onclick="installUpdate()" data-i18n="update_btn" style="background: white; color: #238636; border: none; padding: 4px 8px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px;">Update Now</button>
  </div>

  <div id="terminal-container"></div>
  
  <div id="loader-modal">
    <div class="spinner"></div>
    <div id="loader-text">Loading...</div>
    <div id="loader-progress-container" style="display:none; width: 200px; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; margin-top: 15px; overflow: hidden;">
      <div id="loader-progress-bar" style="width: 0%; height: 100%; background: #58a6ff; transition: width 0.2s;"></div>
    </div>
  </div>
  
  <div id="notification"></div>
  
  <div id="footer" class="toolbar-footer">
    <div id="extra-keys-menu" class="context-menu">
      <div class="context-menu-grid">
        <div style="grid-column: span 12; display: flex; gap: 4px; background: rgba(0,0,0,0.15); padding: 4px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 2px;">
          <button class="tool-btn theme-choice-btn" data-theme-choice="auto" onclick="setThemeMode('auto')" data-i18n="auto" style="flex: 1; font-size: 10px; padding: 4px;">🌓 Auto</button>
          <button class="tool-btn theme-choice-btn" data-theme-choice="light" onclick="setThemeMode('light')" data-i18n="light" style="flex: 1; font-size: 10px; padding: 4px;">☀️ Light</button>
          <button class="tool-btn theme-choice-btn" data-theme-choice="dark" onclick="setThemeMode('dark')" data-i18n="dark" style="flex: 1; font-size: 10px; padding: 4px;">🌙 Dark</button>
        </div>
        <button class="tool-btn copy-menu-btn" onclick="copySelection()" style="font-size: 11px; display: flex; flex-direction: column; justify-content: center; align-items: center; line-height: 1; grid-column: span 3;">
          <span data-i18n="copy_label" style="font-size: 8px; color: #aaa; margin-bottom: 2px; text-transform: uppercase;">Copy</span>
          <span data-i18n="copy_text">Copy</span>
        </button>
        <button class="tool-btn paste-menu-btn" onclick="pasteFromClipboard()" style="font-size: 11px; display: flex; flex-direction: column; justify-content: center; align-items: center; line-height: 1; grid-column: span 3;">
          <span data-i18n="paste_label" style="font-size: 8px; color: #aaa; margin-bottom: 2px; text-transform: uppercase;">Paste</span>
          <span data-i18n="paste_text">Paste</span>
        </button>
        <button class="tool-btn" data-key="CtrlC" data-code="67" data-ctrl="true" style="font-size: 11px; display: flex; flex-direction: column; justify-content: center; align-items: center; line-height: 1; grid-column: span 3;">
          <span data-i18n="interrupt_label" style="font-size: 8px; color: #ff7b72; margin-bottom: 2px; text-transform: uppercase;">Interrupt</span>
          <span data-i18n="interrupt_text">Ctrl+C</span>
        </button>
        <button class="tool-btn" data-key="CtrlZ" data-code="90" data-ctrl="true" style="font-size: 11px; display: flex; flex-direction: column; justify-content: center; align-items: center; line-height: 1; grid-column: span 3;">
          <span data-i18n="suspend_label" style="font-size: 8px; color: #aaa; margin-bottom: 2px; text-transform: uppercase;">Suspend</span>
          <span data-i18n="suspend_text">Ctrl+Z</span>
        </button>
        <button class="tool-btn" data-key="PageUp" data-code="33" style="grid-column: span 6;">PgUp</button>
        <button class="tool-btn" data-key="PageDown" data-code="34" style="grid-column: span 6;">PgDn</button>
        <button class="tool-btn" onclick="copyAuthUrl()" style="display: flex; flex-direction: column; justify-content: center; align-items: center; line-height: 1.2; grid-column: span 6; padding: 6px; background: #1f6feb; color: white;">
          <span data-i18n="copy_auth_label" style="font-size: 8px; color: #d4edda; text-transform: uppercase; margin-bottom: 2px;">Detect & Copy</span>
          <span data-i18n="copy_auth_text" style="font-size: 11px; font-weight: bold;">Copy Auth Link</span>
        </button>
        <button class="tool-btn" onclick="toggleToolbarPosition()" style="display: flex; flex-direction: column; justify-content: center; align-items: center; line-height: 1.2; grid-column: span 6; padding: 6px;">
          <span data-i18n="pos_label" style="font-size: 8px; color: #aaa; text-transform: uppercase; margin-bottom: 2px;">Toolbar Position</span>
          <span style="font-size: 11px; font-weight: bold;" id="toolbar-pos-text">Top / Bottom</span>
        </button>
        <button class="tool-btn" onclick="exportBackup()" style="display: flex; flex-direction: column; justify-content: center; align-items: center; line-height: 1.2; grid-column: span 6; padding: 6px;">
          <span data-i18n="export_label" style="font-size: 8px; color: #aaa; text-transform: uppercase; margin-bottom: 2px;">Export</span>
          <span data-i18n="export_text" style="font-size: 11px;">Config</span>
        </button>
        <button class="tool-btn" onclick="document.getElementById('import-file-input').click()" style="display: flex; flex-direction: column; justify-content: center; align-items: center; line-height: 1.2; grid-column: span 6; padding: 6px;">
          <span data-i18n="import_label" style="font-size: 8px; color: #aaa; text-transform: uppercase; margin-bottom: 2px;">Import</span>
          <span data-i18n="import_text" style="font-size: 11px;">Config</span>
        </button>
      </div>
    </div>
    <input type="file" id="import-file-input" accept=".tar.gz" style="display: none;" onchange="importBackup(event)">

    <div id="dpad-menu" class="context-menu" style="left: 50%; transform: translateX(-50%); padding: 8px;">
      <div style="display: grid; grid-template-columns: 36px 36px 36px; gap: 4px; justify-content: center;">
        <div style="grid-column: 1; grid-row: 1;">
          <button class="tool-btn" data-key="Home" data-code="36" style="width: 100%; height: 36px; font-weight: bold; font-size: 10px;">Home</button>
        </div>
        <div style="grid-column: 2; grid-row: 1;">
          <button class="tool-btn" data-key="ArrowUp" data-code="38" style="width: 100%; height: 36px; padding: 0;">
            <svg style="pointer-events: none;" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
          </button>
        </div>
        <div style="grid-column: 3; grid-row: 1;">
          <button class="tool-btn" data-key="End" data-code="35" style="width: 100%; height: 36px; font-weight: bold; font-size: 10px;">End</button>
        </div>
        <div style="grid-column: 1; grid-row: 2;">
          <button class="tool-btn" data-key="ArrowLeft" data-code="37" style="width: 100%; height: 36px; padding: 0;">
            <svg style="pointer-events: none;" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          </button>
        </div>
        <div style="grid-column: 2; grid-row: 2;">
          <button class="tool-btn" data-key="ArrowDown" data-code="40" style="width: 100%; height: 36px; padding: 0;">
            <svg style="pointer-events: none;" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
          </button>
        </div>
        <div style="grid-column: 3; grid-row: 2;">
          <button class="tool-btn" data-key="ArrowRight" data-code="39" style="width: 100%; height: 36px; padding: 0;">
            <svg style="pointer-events: none;" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>
        </div>
      </div>
    </div>
    
    <div class="footer-left" style="display: flex; align-items: center;">
      <button id="main-action-btn" class="tool-btn" style="color: #ffffff; padding: 4px; flex-shrink: 0;" onclick="toggleContextMenu(event)">
        <img src="logo.png" class="footer-logo" style="width: 24px; height: 24px; border-radius: 4px; pointer-events: none;" alt="Logo">
      </button>
    </div>
    
    <div class="footer-center">
      <button class="tool-btn" data-key="Escape" data-code="27" style="width: auto; padding: 0 6px; font-weight: bold;">Esc</button>
      <button class="tool-btn tab-btn" data-key="Tab" data-code="9" style="width: auto; padding: 0 8px; margin-right: 8px; font-weight: bold;">Tab</button>
      <button id="dpad-toggle-btn" class="tool-btn" onclick="toggleDpadMenu(event)" style="padding: 0;" title="D-Pad">
        <svg style="pointer-events: none;" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="5 9 2 12 5 15"></polyline>
          <polyline points="9 5 12 2 15 5"></polyline>
          <polyline points="19 9 22 12 19 15"></polyline>
          <polyline points="9 19 12 22 15 19"></polyline>
          <line x1="2" y1="12" x2="22" y2="12"></line>

    function getLang() {
      const userLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      if (userLang.startsWith('es')) return 'es';
      if (userLang.startsWith('de')) return 'de';
      if (userLang.startsWith('fr')) return 'fr';
      if (userLang.startsWith('it')) return 'it';
      if (userLang.startsWith('pt')) return 'pt';
      return 'en';
    }

    function t(key) {
      const lang = getLang();
      return (I18N[lang] && I18N[lang][key]) || I18N['en'][key] || key;
    }

    function applyI18n() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (key) {
          const val = t(key);
          if (val) el.innerText = val;
        }
      });
      const uploadBtn = document.getElementById('upload-btn');
      if (uploadBtn) uploadBtn.title = t('upload_title');
    }

    // Terminal Palettes

      foreground: '#f0f6fc',

    const LIGHT_THEME = {

      foreground: '#1f2328',
      cursor: '#0969da',
      cursorAccent: '#ffffff',

      selectionBackground: '#2188ff',

      brightBlue: '#218bff',

      brightWhite: '#1f2328'
    };

    function getEffectiveTheme() {
      const mode = localStorage.getItem('agy_theme_mode') || 'auto';
      if (mode === 'dark') return 'dark';
      if (mode === 'light') return 'light';
      return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }

    function applyThemeToIframe(iframe, effectiveTheme) {
      try {
        if (!iframe) return;
        const termTheme = effectiveTheme === 'light' ? LIGHT_THEME : DARK_THEME;
        const bg = termTheme.background;
        const selBg = termTheme.selection || termTheme.selectionBackground;
        const selFg = termTheme.selectionForeground || termTheme.foreground;
        
        if (iframe.contentDocument) {
          const doc = iframe.contentDocument;
          if (doc.body) {
            doc.body.style.backgroundColor = bg;
          }
          let styleEl = doc.getElementById('dynamic-term-theme');
          if (!styleEl) {
            styleEl = doc.createElement('style');
            styleEl.id = 'dynamic-term-theme';
            if (doc.head) doc.head.appendChild(styleEl);
            else if (doc.body) doc.body.appendChild(styleEl);
          }
          styleEl.textContent = `
            html, body, #terminal, .terminal, .xterm, .xterm-viewport {
              background-color: ${bg} !important;
            }
            ::selection {
              background-color: ${selBg} !important;
              color: ${selFg} !important;
            }
            .xterm-selection,
            .xterm-selection div,
            .xterm .xterm-selection div,
            .xterm-screen .xterm-selection div,
            .xterm-rows span::selection {
              background-color: ${selBg} !important;
              color: ${selFg} !important;
              opacity: 0.9 !important;
            }
          `;
          const vp = doc.querySelector('.xterm-viewport');
          if (vp) vp.style.backgroundColor = bg;
        }
        
        if (iframe.contentWindow) {
          const term = iframe.contentWindow.term || iframe.contentWindow.t || (iframe.contentWindow.ttyd && iframe.contentWindow.ttyd.term);
          if (term) {
            if (term.options) {
              term.options.theme = termTheme;
            }
            if (typeof term.setOption === 'function') {
              term.setOption('theme', termTheme);
            }
            if (typeof term.refresh === 'function') {
              term.refresh(0, term.rows - 1);
            }
          }
        }
      } catch(e) {}
    }

    function applyTheme(mode) {
      if (mode) {
        localStorage.setItem('agy_theme_mode', mode);
      }
      const currentMode = localStorage.getItem('agy_theme_mode') || 'auto';
      const effective = getEffectiveTheme();
      
      document.documentElement.setAttribute('data-theme', effective);
      
      const themeBtn = document.getElementById('theme-btn');
      if (themeBtn) {
        if (currentMode === 'auto') {
          themeBtn.title = `${t('theme_title')}: Auto (${effective === 'light' ? t('light') : t('dark')})`;
          themeBtn.innerHTML = `<svg style="pointer-events: none;" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a10 10 0 0 1 0 20z" fill="currentColor"></path></svg>`;
        } else if (currentMode === 'light') {
          themeBtn.title = `${t('theme_title')}: ${t('light')}`;
          themeBtn.innerHTML = `<svg style="pointer-events: none;" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
        } else {
          themeBtn.title = `${t('theme_title')}: ${t('dark')}`;
          themeBtn.innerHTML = `<svg style="pointer-events: none;" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;
        }
      }
      
      document.querySelectorAll('.theme-choice-btn').forEach(btn => {
        const choice = btn.getAttribute('data-theme-choice');
        if (choice === currentMode) {
          btn.style.borderColor = '#58a6ff';
          btn.style.fontWeight = 'bold';
        } else {
          btn.style.borderColor = 'var(--border-color)';
          btn.style.fontWeight = 'normal';
        }
      });

      document.querySelectorAll('.term-iframe').forEach(iframe => {
        applyThemeToIframe(iframe, effective);
      });
    }

    function setThemeMode(mode) {
      applyTheme(mode);
      const menu = document.getElementById('extra-keys-menu');
      if (menu) menu.classList.remove('show');
      showNotification(`${t('theme_set')}${mode.toUpperCase()}`);
    }

    function cycleTheme(e) {
      if (e) e.stopPropagation();
      const current = localStorage.getItem('agy_theme_mode') || 'auto';
      const next = current === 'auto' ? 'light' : current === 'light' ? 'dark' : 'auto';
      applyTheme(next);
      showNotification(`${t('theme_set')}${next.toUpperCase()}`);
    }

    // Auto-listen to system & Home Assistant theme changes
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        const currentMode = localStorage.getItem('agy_theme_mode') || 'auto';
        if (currentMode === 'auto') {
          applyTheme('auto');
        }
      });
    }

    window.addEventListener('message', (event) => {
      if (event.data && typeof event.data === 'object') {
        if (event.data.type === 'ha-theme-changed' || event.data.theme) {
          const currentMode = localStorage.getItem('agy_theme_mode') || 'auto';
          if (currentMode === 'auto') {
            applyTheme('auto');
          }
        }
      }
    });

    // Tab & Session Management

    window.copyAuthUrl = function() {
      const iframe = getActiveIframe();
      if (!iframe) {
        showNotification("No terminal active");
        return;
      }
      let fullText = "";
      try {
        const win = iframe.contentWindow;
        const doc = iframe.contentDocument || (win ? win.document : null);
        
        if (win && win.term && win.term.buffer && win.term.buffer.active) {
          const buf = win.term.buffer.active;
          for (let i = 0; i < buf.length; i++) {
            const line = buf.getLine(i);
            if (line) fullText += line.translateToString(true) + "\n";
          }
        }
        
        if (!fullText && doc) {
          const rows = doc.querySelectorAll('.xterm-rows > div');
          if (rows && rows.length > 0) {
            rows.forEach(r => { fullText += r.innerText + "\n"; });
          }
        }

        if (!fullText && doc) {
          const acc = doc.querySelector('.xterm-accessibility');
          if (acc) fullText = acc.innerText;
        }

        if (!fullText && doc && doc.body) {
          fullText = doc.body.innerText;
        }
      } catch (e) {
        console.error("Error reading terminal text:", e);
      }

      const match = fullText.match(/https:\/\/accounts\.google\.com\/o\/oauth2\/auth[\s\S]*?(?=\n\s*\n|\n\s*If you|authorization code|$)/i);
      if (match) {
        let cleanUrl = match[0].replace(/[\r\n\s]+/g, '');
        cleanUrl = cleanUrl.replace(/%2F2F/g, '%2F');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(cleanUrl).then(() => {
            showNotification("Auth Link copied to clipboard!");
          }).catch(() => {
            prompt("Copy Auth URL:", cleanUrl);
          });
        } else {
          prompt("Copy Auth URL:", cleanUrl);
        }
      } else {
        showNotification("No Auth Link detected in terminal");
      }
    };

    function getActiveIframe() {
      return document.querySelector(`.term-iframe[data-session-id="${currentSessionId}"]`);
    }

    function setupIframeEvents(iframe) {
      try {
        const iframeWin = iframe.contentWindow;
        if (!iframeWin) return;
        const iframeDoc = iframeWin.document;
        
        const interval = setInterval(() => {
          const viewport = iframeDoc.querySelector('.xterm-viewport');
          const screen = iframeDoc.querySelector('.xterm-screen');
          
          if (viewport && screen) {
            clearInterval(interval);
            applyThemeToIframe(iframe, getEffectiveTheme());
            
            const fixTextarea = () => {
              const ta = iframeDoc.querySelector('.xterm-helper-textarea');
              if (ta && !ta.dataset.fixed) {
                ta.dataset.fixed = "true";
                ta.setAttribute('autocomplete', 'off');
                ta.setAttribute('autocorrect', 'off');
                ta.setAttribute('autocapitalize', 'off');
                ta.setAttribute('spellcheck', 'false');
                ta.setAttribute('data-gramm', 'false');
              }
            };
            fixTextarea();

            iframeDoc.addEventListener('contextmenu', (e) => {
              e.preventDefault();
            });

            const observer = new MutationObserver((mutations) => {
              fixTextarea();
              mutations.forEach((mutation) => {
                mutation.addedNodes.forEach((node) => {
                  if (node.nodeType === 1 && node.tagName === 'DIV' && !node.className) {
                    const text = node.textContent || '';
                    if (text.match(/^\d+x\d+$/)) {
                      node.style.display = 'none';
                    } else if (text.includes('Reconnect') || text.includes('Closed')) {
                      node.style.display = 'none';
                      setTimeout(() => {
                        const textarea = iframeDoc.querySelector('.xterm-helper-textarea');
                        if (textarea) {
                          textarea.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', code: 'Enter', keyCode: 13, bubbles: true }));
                        } else {
                          screen.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', code: 'Enter', keyCode: 13, bubbles: true }));
                        }
                      }, 500);
                    }
                  }
                });
              });
            });
            
            const xtermContainer = iframeDoc.querySelector('.xterm');
            if (xtermContainer) {
              observer.observe(xtermContainer, { childList: true });
            }
            
            const FRICTION = 0.97;
            const MIN_VELOCITY = 0.3;
            
            let lastY = 0, lastTime = 0, velocity = 0;
            let animId = null, tracking = false;
            
            function coast() {
              velocity *= FRICTION;
              if (Math.abs(velocity) < MIN_VELOCITY) { animId = null; return; }
              viewport.scrollTop += velocity;
              animId = iframeWin.requestAnimationFrame(coast);
            }
            
            function stop() {
              if (animId) { iframeWin.cancelAnimationFrame(animId); animId = null; }
              velocity = 0;
            }
            
            screen.addEventListener('touchstart', (e) => {
              if (e.touches.length !== 1) return;
              stop();
              lastY = e.touches[0].clientY;
              lastTime = performance.now();
              tracking = true;
            }, { passive: false, capture: true });
            
            screen.addEventListener('touchmove', (e) => {
              if (!tracking || e.touches.length !== 1) return;
              const y = e.touches[0].clientY;
              const now = performance.now();
              const dt = now - lastTime;
              const dy = lastY - y;
              
              if (dt > 0) {
                const v = (dy / dt) * 16;
                velocity = velocity * 0.2 + v * 0.8;
              }
              
              viewport.scrollTop += dy;
              
              lastY = y;
              lastTime = now;
              e.preventDefault();
              e.stopImmediatePropagation();
            }, { passive: false, capture: true });
            
            screen.addEventListener('touchend', () => {
              if (!tracking) return;
              tracking = false;
              if (Math.abs(velocity) > MIN_VELOCITY) {
                animId = iframeWin.requestAnimationFrame(coast);
              }
            }, { passive: false, capture: true });
            
            screen.addEventListener('touchcancel', () => {
              tracking = false; stop();
            }, { passive: false, capture: true });
            
            const scrollToBottom = () => {
              if (viewport) viewport.scrollTop = viewport.scrollHeight;
            };

            [100, 300, 600, 1000].forEach(delay => {
              setTimeout(scrollToBottom, delay);
            });
            
            // Enable copyOnSelect on xterm instance
            if (iframeWin.term) {
              if (iframeWin.term.options) {
                iframeWin.term.options.copyOnSelect = true;
              }
              if (typeof iframeWin.term.onSelectionChange === 'function') {
                iframeWin.term.onSelectionChange(() => {
                  const sel = iframeWin.term.getSelection();
                  if (sel && sel.trim().length > 0) {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                      navigator.clipboard.writeText(sel).catch(() => {});
                    }
                  }
                });
              }
            }

            const handleCopyKey = (e) => {
              const isCtrlC = (e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C' || e.keyCode === 67);
              if (isCtrlC) {
                let hasSel = false;
                if (iframeWin.term && typeof iframeWin.term.hasSelection === 'function') {
                  hasSel = iframeWin.term.hasSelection();
                }
                if (!hasSel && iframeDoc.getSelection) {
                  hasSel = iframeDoc.getSelection().toString().length > 0;
                }
                if (e.shiftKey || hasSel) {
                  if (hasSel) {
                    e.preventDefault();
                    e.stopPropagation();
                    window.copySelection();
                  }
                }
              }
            };
            iframeDoc.addEventListener('keydown', handleCopyKey, true);
            window.addEventListener('keydown', handleCopyKey, true);

            iframeWin.addEventListener('resize', () => {
              [10, 50, 150, 300, 500].forEach(delay => { setTimeout(scrollToBottom, delay); });
            });

            iframeDoc.addEventListener('focusin', () => {
              [50, 150, 300, 500, 800].forEach(delay => setTimeout(adjustForKeyboard, delay));
            });
            iframeDoc.addEventListener('focusout', () => {
              [50, 150, 300].forEach(delay => setTimeout(adjustForKeyboard, delay));
            });
          }
        }, 500);
      } catch(err) {
        console.error("Iframe access error:", err);
      }
    }

    function ensureIframe(id) {
      const container = document.getElementById('terminal-container');
      let iframe = document.querySelector(`.term-iframe[data-session-id="${id}"]`);
      if (!iframe) {
        iframe = document.createElement('iframe');
        iframe.className = 'term-iframe';
        iframe.setAttribute('data-session-id', id);
        iframe.src = 'ttyd/?arg=' + id;
        iframe.onload = () => {
          applyThemeToIframe(iframe, getEffectiveTheme());
          setupIframeEvents(iframe);
        };
        container.appendChild(iframe);
      }
      return iframe;
    }

    window.switchSession = function(id) {
      currentSessionId = id;
      saveSessions();
      const iframe = ensureIframe(id);

      document.querySelectorAll('.term-iframe').forEach(f => {
        if (parseInt(f.getAttribute('data-session-id')) === id) {
          f.style.display = 'block';
          f.classList.add('active');
          applyThemeToIframe(f, getEffectiveTheme());
        } else {
          f.style.display = 'none';
          f.classList.remove('active');
        }
      });

      renderTabs();
    };

    window.createSession = function() {
      const maxId = sessions.reduce((max, s) => Math.max(max, s.id), 0);
      const newId = maxId + 1;
      sessions.push({id: newId, name: t('session_prefix') + newId});
      switchSession(newId);
    };

    window.closeSession = async function(e, id) {
      e.stopPropagation();
      if (sessions.length <= 1) return;
      
      const idx = sessions.findIndex(s => s.id === id);
      sessions.splice(idx, 1);
      
      const iframe = document.querySelector(`.term-iframe[data-session-id="${id}"]`);
      if (iframe) iframe.remove();
      
      if (currentSessionId === id) {
        switchSession(sessions[Math.max(0, idx - 1)].id);
      } else {
        saveSessions();
        renderTabs();
      }
      
      try {
        await fetch('kill?session_id=' + id);
      } catch(err) { console.error('Failed to kill session', err); }
    };

    function renderTabs() {
      const tabBar = document.getElementById('tab-bar');
      tabBar.innerHTML = '';
      
      sessions.forEach(s => {
        const tab = document.createElement('div');
        tab.className = 'tab' + (s.id === currentSessionId ? ' active' : '');
        let closeHtml = sessions.length > 1 ? `<span class="tab-close" onclick="closeSession(event, ${s.id})">×</span>` : '';
        tab.innerHTML = `<span>${s.name}</span>${closeHtml}`;
        tab.onclick = () => switchSession(s.id);
        tabBar.appendChild(tab);
      });
      
      const addBtn = document.createElement('button');
      addBtn.className = 'tab-add';
      addBtn.innerHTML = '+';
      addBtn.onclick = createSession;
      tabBar.appendChild(addBtn);
    }

    // Android Keyboard & Visual Viewport Handler (keeps footer permanently visible above keyboard)
    function adjustForKeyboard() {
      const vh = (window.visualViewport && window.visualViewport.height > 100) ? window.visualViewport.height : window.innerHeight;
      const top = (window.visualViewport && window.visualViewport.offsetTop > 0) ? window.visualViewport.offsetTop : 0;
      
      const appRoot = document.getElementById('app-root');
      if (appRoot) {
        appRoot.style.height = `${vh}px`;
        appRoot.style.top = `${top}px`;
      }

      const activeIframe = getActiveIframe();
      if (activeIframe && activeIframe.contentWindow) {
        activeIframe.contentWindow.dispatchEvent(new Event('resize'));
      }
    }

    window.addEventListener('resize', adjustForKeyboard);
    window.addEventListener('orientationchange', () => setTimeout(adjustForKeyboard, 300));
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', adjustForKeyboard);

    }
    setInterval(adjustForKeyboard, 400);

    async function uploadImage() {
      const fileInput = document.getElementById('file');
      if (!fileInput.files.length) return;
      
      const file = fileInput.files[0];
      const btn = document.getElementById('upload-btn');
      const originalHtml = btn.innerHTML;
      btn.innerHTML = '...';
      
      const formData = new FormData();
      formData.append('file', file);
      formData.append('session_id', currentSessionId);
      
      try {
        const res = await fetch('upload', {
          method: 'POST',
          body: formData
        });
        if (res.ok) {
          const data = await res.json();
          try {
            const iframe = getActiveIframe();
            if (iframe && iframe.contentWindow && iframe.contentWindow.term) {
              iframe.contentWindow.term.paste(data.filepath);
              showNotification(`${t('img_inserted')}${data.filepath}`);
            } else {
              throw new Error("No terminal target found");
            }
          } catch(err) {
            try {
              await navigator.clipboard.writeText(`"${data.filepath}"`);
              showNotification(`Path copied to clipboard!\n${data.filepath}`);
            } catch(e) {
              showNotification(`Path: ${data.filepath}`);
            }
          }
        } else {
          showNotification("Error uploading");
        }
      } catch(e) {
        showNotification(t('net_failed'));
      }
      
      btn.innerHTML = originalHtml;
      fileInput.value = '';
    }

    window.copySelection = async function() {
      try {
        const iframe = getActiveIframe();
        let text = '';
        if (iframe && iframe.contentWindow) {
          if (iframe.contentWindow.term && typeof iframe.contentWindow.term.getSelection === 'function') {
            text = iframe.contentWindow.term.getSelection();
          }
        }
        if (!text && iframe && iframe.contentDocument) {
          text = iframe.contentDocument.getSelection() ? iframe.contentDocument.getSelection().toString() : '';
        }
        if (!text && window.getSelection) {
          text = window.getSelection().toString();
        }
        if (text && text.trim().length > 0) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
          }
          showNotification(t('text_copied'));

          showNotification(t('no_text_selected'));

      } catch (err) {

    window.pasteFromClipboard = async function() {

        const text = await navigator.clipboard.readText();
        if (!text) return;
        const iframe = getActiveIframe();

    function sendVirtualKey(key, keyCode) {
      try {
        const iframe = getActiveIframe();
        if (!iframe || !iframe.contentDocument) return;
        const iframeDoc = iframe.contentDocument;
        
        const target = iframeDoc.querySelector('.xterm-helper-textarea') || iframeDoc.querySelector('.xterm-screen');
        if (!target) return;
        
        const seq = {
          'Enter': '\r', 'Escape': '\x1b', 'Tab': '\x09',
          'ArrowUp': '\x1b[A', 'ArrowDown': '\x1b[B', 'ArrowLeft': '\x1b[D', 'ArrowRight': '\x1b[C',
          'CtrlC': '\x03', 'CtrlD': '\x04', 'CtrlZ': '\x1a'
        };

        if (seq[key]) {
            const dt = new DataTransfer();
            dt.setData('text/plain', seq[key]);
            target.dispatchEvent(new ClipboardEvent('paste', {
                clipboardData: dt, bubbles: true, cancelable: true
            }));
        } else if (keyCode) {
            target.dispatchEvent(new KeyboardEvent('keydown', {
                key: key, code: key, keyCode: keyCode, which: keyCode, bubbles: true
            }));
        }
      } catch(e) {}
    }

    document.querySelectorAll('.tool-btn').forEach(btn => {
      btn.addEventListener('mousedown', (e) => {
        const key = btn.getAttribute('data-key');
        const cmd = btn.getAttribute('data-cmd');
        if (key || cmd || btn.classList.contains('paste-menu-btn')) {
          e.preventDefault();
        }
      });
      
      btn.addEventListener('click', (e) => {
        if (btn.id !== 'main-action-btn') {

        }
        
        const key = btn.getAttribute('data-key');
        const cmd = btn.getAttribute('data-cmd');
        
        if (key || cmd) {
          const code = parseInt(btn.getAttribute('data-code') || '0');
          const isCtrl = btn.getAttribute('data-ctrl') === 'true';
          const theIframe = getActiveIframe();
          const iframeDoc = theIframe && theIframe.contentWindow ? theIframe.contentWindow.document : null;

    async function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      document.getElementById('extra-keys-menu').classList.remove('show');
      
      const proceed = confirm(t('import_confirm'));
      if (!proceed) {
        event.target.value = '';
        return;
      }
      
      showLoader(t('starting_restore'), true);
      
      const chunkSize = 10 * 1024 * 1024;
      const totalChunks = Math.ceil(file.size / chunkSize);
      
      try {
        for (let i = 0; i < totalChunks; i++) {
          const start = i * chunkSize;
          const end = Math.min(start + chunkSize, file.size);
          const chunk = file.slice(start, end);
          
          const formData = new FormData();
          formData.append('file', chunk);
          
          const percent = Math.round((i / totalChunks) * 100);
          updateProgress(percent, `${t('uploading_backup')} ${percent}%`);
          
          const res = await fetch(`import_chunk?chunk_index=${i}&total_chunks=${totalChunks}`, {
            method: 'POST',
            body: formData
          });
          
          if (!res.ok) {
            const text = await res.text();
            throw new Error(text);
          }
        }
        
        updateProgress(100, t('extracting_restarting'));
        alert(t('import_success'));
      } catch (err) {
        alert(t('import_failed') + err.message);
      } finally {
        hideLoader();
        event.target.value = '';
      }
    } 
  </script>
</body>
</html>
